name = "dept-quiz"
main = "worker/index.ts"
compatibility_date = "2026-11-01"

# Fichiers statiques produits par `npm run build` ; le Worker ne reçoit que /api/*
[assets]
directory = "dist"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "dept-quiz"
database_id = "8a9557b1-5cc3-41f7-b81d-faccaa7b959b"
migrations_dir = "migrations"
